name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true # exiftool tests are skipped when it is missing
        run: choco install exiftool -y --no-progress
      - run: go vet ./...
      - run: go test -race ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/build.sh

  # Runs camback against a real OpenSSH server in Docker (e2e/sshd).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      # -count=1: the binary and image are built by subprocesses, which the
      # test cache (restored by setup-go) does not track.
      - run: go test -count=1 -tags e2e ./e2e/...
